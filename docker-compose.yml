services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://mlops:mlops@db:5432/mlops
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DEPLOY_STEP_DELAY_SECONDS: "0.4"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql://mlops:mlops@db:5432/mlops
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DEPLOY_STEP_DELAY_SECONDS: "0.4"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    build: ./backend
    working_dir: /workspace
    command: python /workspace/scripts/seed.py
    environment:
      DATABASE_URL: postgresql://mlops:mlops@db:5432/mlops
      PYTHONPATH: /workspace/backend
    volumes:
      - ./:/workspace
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
