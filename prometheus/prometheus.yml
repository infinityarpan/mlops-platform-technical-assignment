global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: mlops-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: mlops-inference
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
